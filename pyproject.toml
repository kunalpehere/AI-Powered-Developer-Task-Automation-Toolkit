[build-system]
requires = ["setuptools>=73"]
build-backend = "setuptools.build_meta"

[project]
name = "taskmaster"
version = "2.0.1"
description = "Developer workspace inspection, verified duplicates, and validated file workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["rich>=13.8,<14"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
    "pip-audit>=2.10,<3",
    "pip-tools>=7.6,<8",
    "build>=1.6,<2",
    "setuptools>=84,<85",
    "wheel>=0.48,<0.49",
    "PyYAML>=6,<7",
]

[project.scripts]
taskmaster = "taskmaster.cli:main"
tm = "taskmaster.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["taskmaster", "taskmaster.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv*", ".install-check", ".test-tmp", "docs/audits"]

[tool.ruff.lint]
# Start with correctness checks; do not reformat inherited code to pass style rules.
select = ["E9", "F"]

[tool.coverage.run]
branch = true
source = ["taskmaster"]
relative_files = true
# Coverage of subprocess-based CLI tests is collected as well as in-process calls.
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
precision = 2
skip_empty = true
